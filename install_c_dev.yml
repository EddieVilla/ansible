---
- name: Install C development tools
  hosts: all
  become: true

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install gcc, gdb, and make
      ansible.builtin.apt:
        name:
          - gcc
          - gdb
          - make
        state: present
